<section class="lab" id="lab-parking"><div class="lh"><p class="k"><a href="../process.html">← AI와 설계하기</a> · LAB 05 · OPTIMIZATION</p><h3>주차 배치</h3><p>직각주차 모듈(구획 + 차로 + 구획)을 5° 간격 36개 각도, 오프셋, 세로 연결 차로 위치를 바꿔 가며 깔아 보고 가장 많이 들어가는 안을 고른다. 오른쪽 그래프는 각도별 최대 대수이고, 막대를 누르면 그 각도의 배치를 볼 수 있다. 용도별 시설면적으로 법정 대수와 비교한다.</p></div><div class="app"></div></section><script>// 실험 앱 공통: 슬라이더 패널 만들기 + 임베드(모달) 모드
(function(){

    let tm=null;

  window.LabRng=function(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}};

window.LD={INK:'#e6e3da',DIM:'#8a8a80',FAINT:'#3a3a35',BG:'#151513',RED:'#ff6b4a',BLUE:'#4da3ff',GREEN:'#9fd36b',MONO:'"JetBrains Mono",ui-monospace,monospace',
  fit:function(cv){var r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;var g=cv.getContext('2d');g.setTransform(d,0,0,d,0,0);g.lineJoin='round';g.fillStyle='#151513';g.fillRect(0,0,r.width,r.height);return [g,r.width,r.height];},
  path:function(g,p,close){g.beginPath();p.forEach(function(v,i){i?g.lineTo(v[0],v[1]):g.moveTo(v[0],v[1]);});if(close!==false)g.closePath();},

  dim:function(g,x1,y1,x2,y2,label,off,c){c=c||LD.BLUE;var dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,nx=-dy/L*off,ny=dx/L*off;g.strokeStyle=c;g.lineWidth=.7;g.beginPath();

    var mx=(x1+x2)/2+nx*1.6,my=(y1+y2)/2+ny*1.6;g.save();g.translate(mx,my);var a=Math.atan2(dy,dx);if(a>Math.PI/2||a<-Math.PI/2)a+=Math.PI;g.rotate(a);LD.text(g,label,0,3,{c:c,a:'center'});g.restore();},

// 실사용 도구줄: 좌표 · DXF 입력, PNG · CSV · DXF 내보내기, 링크로 조건 저장
window.LabIO=function(app,o){
  const bar=document.createElement('div'); bar.className='lio';
  bar.innerHTML=(o.poly?`<details class="lin"><summary>대지 입력</summary><p>꼭짓점 좌표를 한 줄에 하나씩 <code>x, y</code> (m, 북쪽이 +y). 또는 DXF의 닫힌 폴리라인을 올리세요.</p><textarea rows="6"></textarea><div><button type="button" class="ap">좌표 적용</button><label class="up">DXF 열기<input type="file" accept=".dxf"></label><span class="msg"></span></div></details>`:'')+
    `<button type="button" data-x="png">PNG</button><button type="button" data-x="csv">CSV</button>${o.dxf?'<button type="button" data-x="dxf">DXF</button>':''}<button type="button" data-x="link">링크 복사</button>`;
  app.appendChild(bar);
  const name=o.name||'lab', msg=bar.querySelector('.msg');
  const save=(blob,fn)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);};
  const flash=(b,t)=>{const o2=b.textContent;b.textContent=t;setTimeout(()=>b.textContent=o2,1400);};
  // 좌표 ↔ 내부 좌표 (내부는 y가 아래로 = 남쪽)
  const toText=p=>p.map(q=>`${q[0].toFixed(2)}, ${(-q[1]).toFixed(2)}`).join('\n');
  function setPoly(pts){ if(pts.length<3){msg.textContent='점이 3개 이상 필요해요';return;}
    const xs=pts.map(p=>p[0]),ys=pts.map(p=>-p[1]),mx=Math.min(...xs),my=Math.min(...ys);
    o.poly.set(pts.map(p=>[Math.round((p[0]-mx+3)*100)/100,Math.round((-p[1]-my+3)*100)/100])); msg.textContent=pts.length+'개 점 적용'; o.redraw(); }
  if(o.poly){
    const ta=bar.querySelector('textarea'); bar.querySelector('.lin').addEventListener('toggle',()=>{ta.value=toText(o.poly.get());});
    bar.querySelector('.ap').onclick=()=>{const pts=ta.value.split(/\n/).map(l=>l.split(/[,\s\t]+/).filter(Boolean).map(Number)).filter(a=>a.length>=2&&a.every(isFinite)).map(a=>[a[0],a[1]]);setPoly(pts);};
    bar.querySelector('input[type=file]').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{
      const L=t.split(/\r?\n/).map(s=>s.trim()), polys=[]; let cur=null;
      for(let i=0;i<L.length-1;i+=2){const c=L[i],v=L[i+1];
        if(c==='0'){ if(cur&&cur.length>2) polys.push(cur); cur=(v==='LWPOLYLINE'||v==='POLYLINE')?[]:(v==='VERTEX'&&cur?cur:null); if(v==='VERTEX'&&polys.length&&!cur){} }
        else if(cur&&c==='10') cur.push([+v,0]); else if(cur&&c==='20'&&cur.length) cur[cur.length-1][1]=+v; }
      if(cur&&cur.length>2) polys.push(cur);
      if(!polys.length){msg.textContent='닫힌 폴리라인을 찾지 못했어요';return;}
      const ar=p=>Math.abs(p.reduce((s,a,i)=>{const b=p[(i+1)%p.length];return s+a[0]*b[1]-b[0]*a[1];},0))/2;
      let P=polys.sort((a,b)=>ar(b)-ar(a))[0]; const ext=Math.max(...P.map(p=>Math.abs(p[0])),...P.map(p=>Math.abs(p[1])));
      const xs=P.map(p=>p[0]),ys=P.map(p=>p[1]),span=Math.max(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys));
      if(span>1000) P=P.map(p=>[p[0]/1000,p[1]/1000]); // mm → m
      setPoly(P); ta.value=toText(o.poly.get());});};
  }
  bar.addEventListener('click',e=>{const x=e.target.dataset&&e.target.dataset.x;if(!x)return;
    if(x==='png'){const cvs=[...app.querySelectorAll('canvas')],h=Math.max(...cvs.map(c=>c.height)),w=cvs.reduce((s,c)=>s+c.width,0);
      const out=document.createElement('canvas');out.width=w;out.height=h;const g=out.getContext('2d');g.fillStyle='#151513';g.fillRect(0,0,w,h);let ox=0;cvs.forEach(c=>{g.drawImage(c,ox,0);ox+=c.width;});
      out.toBlob(b=>save(b,name+'.png'));}
    if(x==='csv'){const rows=[...app.querySelectorAll('.nls div')].map(d=>[d.querySelector('span').textContent,d.querySelector('b').textContent]);
      const st=o.state();rows.push(['',''],['입력값','']);Object.entries(st.P||{}).forEach(([k,v])=>rows.push([k,v]));
      if(o.poly) o.poly.get().forEach((p,i)=>rows.push(['대지 점 '+(i+1),p[0].toFixed(2)+' / '+(-p[1]).toFixed(2)]));
      save(new Blob(['﻿'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'}),name+'.csv');}
    if(x==='dxf'){const ents=o.dxf();let d='0\nSECTION\n2\nENTITIES\n';
      ents.forEach(en=>{const p=en.pts,n=p.length,z=en.z||0;for(let i=0;i<(en.closed===false?n-1:n);i++){const a=p[i],b=p[(i+1)%n];
        d+=`0\nLINE\n8\n${en.layer}\n10\n${a[0].toFixed(3)}\n20\n${(-a[1]).toFixed(3)}\n30\n${(a[2]!==undefined?a[2]:z).toFixed(3)}\n11\n${b[0].toFixed(3)}\n21\n${(-b[1]).toFixed(3)}\n31\n${(b[2]!==undefined?b[2]:z).toFixed(3)}\n`;}});
      d+='0\nENDSEC\n0\nEOF\n'; save(new Blob([d],{type:'application/dxf'}),name+'.dxf');}
    if(x==='link'){const u=location.href.split('#')[0]+'#s='+btoa(unescape(encodeURIComponent(JSON.stringify(o.state()))));
      (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>flash(e.target,'복사됨'),()=>{prompt('이 링크를 복사하세요',u);});}
  });
  // 링크로 연 경우 조건 복원
  const m=location.hash.match(/s=([^&]+)/); if(m){try{o.load(JSON.parse(decodeURIComponent(escape(atob(m[1])))));}catch(e){}}
};
// LAB 05 — 주차 배치
// 대지 꼭짓점을 끌면, 주차 모듈(구획 5.0 + 차로 6.0 + 구획 5.0)을 여러 각도 · 오프셋 · 연결 차로 위치로 깔아 보고
// 가장 많이 들어가는 안을 고른다. 법정 주차대수(용도별 시설면적당 1대)와 비교한다.
(function(){
  const root=document.getElementById('lab-parking'); if(!root) return;
  const USE=[{n:'업무시설',a:150},{n:'근린생활시설',a:134},{n:'판매시설',a:150},{n:'숙박시설',a:200}];
  const P={sw:2.5,sl:5.0,aw:6.0,use:0,gfa:4000,sb:1.0};
  let poly=[[4,6],[52,2],[57,34],[30,44],[6,36]];
  let best=null;
  const app=root.querySelector('.app');
  app.innerHTML=`<div class="lctl"></div>
  <div class="nlv"><div class="cv sheet"><canvas class="top"></canvas><p class="hint">꼭짓점 드래그 · 변 더블클릭 = 점 추가 · 점 더블클릭 = 삭제</p></div>
  <div class="cv sheet"><canvas class="gr"></canvas><p class="hint">각도별 최대 대수 (탐색 결과) · 막대를 누르면 그 각도로</p></div></div><div class="nls"></div>`;
  const cT=app.querySelector('.top'), cG=app.querySelector('.gr'), out=app.querySelector('.nls');
  const refresh=LabUI(app.querySelector('.lctl'),[
    {g:'주차',k:'구획 폭 m',min:2.3,max:2.6,step:.1,get:()=>P.sw,set:v=>P.sw=v},
    {g:'주차',k:'구획 길이 m',min:5,max:5.2,step:.1,get:()=>P.sl,set:v=>P.sl=v},
    {g:'주차',k:'차로 폭 m',min:5,max:7,step:.5,get:()=>P.aw,set:v=>P.aw=v},
    {g:'주차',k:'경계 이격 m',min:0,max:3,step:.5,get:()=>P.sb,set:v=>P.sb=v},
    {g:'법정 대수',k:'용도',opts:USE.map(u=>u.n),get:()=>P.use,set:v=>P.use=v},
    {g:'법정 대수',k:'시설면적 ㎡',min:500,max:20000,step:100,get:()=>P.gfa,set:v=>P.gfa=v},
  ],()=>{search();draw();});

  const area=p=>Math.abs(p.reduce((s,a,i)=>{const b=p[(i+1)%p.length];return s+a[0]*b[1]-b[0]*a[1];},0))/2;
  function inside(x,y,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const[a,b]=p[i],[d,e]=p[j];if((b>y)!==(e>y)&&x<(d-a)*(y-b)/(e-b)+a)c=!c;}return c;}
  const segD=(x,y,a,b)=>{const dx=b[0]-a[0],dy=b[1]-a[1],t=Math.max(0,Math.min(1,((x-a[0])*dx+(y-a[1])*dy)/(dx*dx+dy*dy)));return Math.hypot(x-a[0]-t*dx,y-a[1]-t*dy);};
  const edgeD=(x,y,p)=>{let m=1e9;for(let i=0;i<p.length;i++)m=Math.min(m,segD(x,y,p[i],p[(i+1)%p.length]));return m;};
  const ok=(x,y,p)=>inside(x,y,p)&&edgeD(x,y,p)>=P.sb-1e-9;

  // 한 각도 · 오프셋 · 연결 차로 위치에서 배치
  function layout(th,oy,cx){
    const c=Math.cos(th),s=Math.sin(th);
    const lp=poly.map(([x,y])=>[x*c+y*s,-x*s+y*c]); // 지역 좌표 (차로가 가로)
    const xs=lp.map(p=>p[0]),ys=lp.map(p=>p[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
    const M=P.sl*2+P.aw, stalls=[], aisles=[];
    const rectOK=(a,b,w,h)=>ok(a,b,lp)&&ok(a+w,b,lp)&&ok(a,b+h,lp)&&ok(a+w,b+h,lp)&&ok(a+w/2,b+h/2,lp);
    const conX=x0+cx;
    for(let y=y0+oy-M;y<y1;y+=M){
      const ay=y+P.sl; // 차로 시작
      // 차로: 지나갈 수 있는 구간
      let segs=[],cur=null;
      for(let x=x0;x<=x1;x+=1){const g=rectOK(x,ay,1,P.aw);if(g){if(!cur)cur=[x,x+1];else cur[1]=x+1;}else if(cur){segs.push(cur);cur=null;}}
      if(cur)segs.push(cur);
      segs=segs.filter(s=>s[1]-s[0]>=P.sw*3);
      segs.forEach(sg=>{aisles.push([sg[0],ay,sg[1]-sg[0],P.aw]);
        for(const row of [[y,0],[ay+P.aw,1]]){
          for(let x=sg[0];x+P.sw<=sg[1]+1e-9;x+=P.sw){
            if(x+P.sw>conX&&x<conX+P.aw) continue; // 연결 차로 자리
            if(rectOK(x,row[0],P.sw,P.sl)) stalls.push([x,row[0],P.sw,P.sl,row[1]]);
          }}});
    }
    // 연결 차로 (세로)
    let con=null; {const ys2=aisles.map(a=>a[1]);if(ys2.length>1){const ya=Math.min(...ys2),yb=Math.max(...ys2)+P.aw;con=[conX,ya,P.aw,yb-ya];}}
    return {th,stalls,aisles,con,n:stalls.length};
  }
  let curTh=null;
  function search(){
    const res=[]; let top=null;
    for(let d=0;d<180;d+=5){const th=d*Math.PI/180; let bt=null;
      for(let oy=0;oy<P.sl*2+P.aw;oy+=2) for(let cx=2;cx<62;cx+=10){const r=layout(th,oy,cx); if(!bt||r.n>bt.n) bt=r;}
      res.push(bt); if(!top||bt.n>top.n) top=bt;}
    best={res,top}; curTh=top.th;
  }
  function current(){ return best.res.find(r=>Math.abs(r.th-curTh)<1e-6)||best.top; }

  let T=null;
  function drawTop(){
    const [g,W,H]=LD.fit(cT), L=current();
    const xs=poly.map(p=>p[0]),ys=poly.map(p=>p[1]),x0=Math.min(...xs)-4,y0=Math.min(...ys)-4,w=Math.max(...xs)-x0+4,h=Math.max(...ys)-y0+4;
    const k=Math.min(W/w,(H-24)/h); T={k,ox:(W-w*k)/2-x0*k,oy:(H-24-h*k)/2-y0*k};
    const c=Math.cos(L.th),s=Math.sin(L.th), G=(x,y)=>{const wx=x*c-y*s,wy=x*s+y*c;return [T.ox+wx*k,T.oy+wy*k];};
    const R=(x,y,w2,h2)=>[G(x,y),G(x+w2,y),G(x+w2,y+h2),G(x,y+h2)];
    LD.path(g,poly.map(p=>[T.ox+p[0]*k,T.oy+p[1]*k]));g.fillStyle='rgba(255,255,255,.025)';g.fill();
    // 차로
    g.fillStyle='rgba(224,161,90,.10)';
    L.aisles.concat(L.con?[L.con]:[]).forEach(a=>{LD.path(g,R(...a));g.fill();});
    g.strokeStyle='rgba(224,161,90,.75)';g.setLineDash([6,4]);g.lineWidth=.8;
    L.aisles.forEach(a=>{LD.path(g,[G(a[0],a[1]+a[3]/2),G(a[0]+a[2],a[1]+a[3]/2)],false);g.stroke();});
    if(L.con){const a=L.con;LD.path(g,[G(a[0]+a[2]/2,a[1]),G(a[0]+a[2]/2,a[1]+a[3])],false);g.stroke();} g.setLineDash([]);
    // 구획 (장애인 구획: 연결 차로에 가까운 앞쪽 몇 칸)
    const need=Math.max(1,Math.ceil(L.n*0.03));
    const acc=new Set(L.con?L.stalls.map((q,i)=>[i,Math.abs(q[0]+q[2]/2-(L.con[0]+L.con[2]/2))+Math.abs(q[1]-L.con[1])*0.2]).sort((a,b)=>a[1]-b[1]).slice(0,need).map(a=>a[0]):[]);
    L.stalls.forEach((q,i)=>{LD.path(g,R(...q.slice(0,4)));if(acc.has(i)){g.fillStyle='rgba(77,163,255,.25)';g.fill();g.strokeStyle=LD.BLUE;}else g.strokeStyle=LD.INK;g.lineWidth=.8;g.stroke();});
    LD.path(g,poly.map(p=>[T.ox+p[0]*k,T.oy+p[1]*k]));g.strokeStyle=LD.INK;g.lineWidth=1.6;g.stroke();
    poly.forEach((a,i)=>{const b=poly[(i+1)%poly.length];LD.text(g,Math.hypot(b[0]-a[0],b[1]-a[1]).toFixed(1)+'m',T.ox+(a[0]+b[0])/2*k,T.oy+(a[1]+b[1])/2*k-6,{a:'center'});});
    poly.forEach(p=>{g.beginPath();g.arc(T.ox+p[0]*k,T.oy+p[1]*k,5,0,7);g.fillStyle=LD.BG;g.fill();g.strokeStyle=LD.BLUE;g.lineWidth=2;g.stroke();});
    LD.text(g,`${L.n}대 · 장애인 ${need}대 · 각도 ${Math.round(L.th*180/Math.PI)}°`,12,18,{c:LD.INK,size:11});
    LD.text(g,'□ 일반  ■ 장애인  --- 차로',12,H-8);
  }
  let GB=null;
  function drawGraph(){
    const [g,W,H]=LD.fit(cG), res=best.res, mx=Math.max(1,...res.map(r=>r.n));
    const l=40,r=14,t=34,b=34, bw=(W-l-r)/res.length; GB={l,bw,t,b,H};
    g.strokeStyle=LD.FAINT;g.lineWidth=.6;for(let i=0;i<=4;i++){const y=t+(H-t-b)*i/4;g.beginPath();g.moveTo(l,y);g.lineTo(W-r,y);g.stroke();LD.text(g,Math.round(mx*(1-i/4)),l-6,y+3,{a:'right'});}
    res.forEach((q,i)=>{const h=(H-t-b)*q.n/mx, on=Math.abs(q.th-curTh)<1e-6, top=q===best.top;
      g.fillStyle=on?LD.RED:top?LD.GREEN:'#4a4a44';g.fillRect(l+i*bw+1,H-b-h,bw-2,h);
      if(i%6===0)LD.text(g,(i*5)+'°',l+i*bw+bw/2,H-b+14,{a:'center'});});
    LD.text(g,`최대 ${best.top.n}대 @ ${Math.round(best.top.th*180/Math.PI)}° · 각도 36 × 오프셋 × 연결 차로 위치 탐색`,12,18,{c:LD.INK,size:11});
    LD.text(g,'■ 선택  ■ 최대',W-120,H-8);
  }
  function stats(){
    const L=current(), U=USE[P.use], need=Math.ceil(P.gfa/U.a), site=area(poly), pa=L.n?site/L.n:0;
    LD.stats(out,[['대지면적',Math.round(site).toLocaleString()+' ㎡'],['배치 대수',L.n+'대'],['장애인 구획 (3%)',Math.max(1,Math.ceil(L.n*0.03))+'대'],['대당 면적',pa.toFixed(1)+' ㎡'],
      ['법정 대수',`${need}대 (${U.n} ${U.a}㎡당 1대)`],['충족',L.n>=need?'OK':'부족 '+(need-L.n)+'대',L.n>=need?'':'ng'],['탐색 최대',best.top.n+'대 @ '+Math.round(best.top.th*180/Math.PI)+'°'],['구획 · 차로',`${P.sw}×${P.sl} · ${P.aw}m`]],
      [1,5],'직각주차 모듈(구획+차로+구획)을 5° 간격 36개 각도, 오프셋, 세로 연결 차로 위치를 바꿔 가며 깔고 가장 많이 들어가는 안을 고른다. 법정 대수는 지자체 조례마다 달라 대표값을 썼고, 램프 · 기계식 · 출입구 위치는 반영하지 않았다.');
  }
  function draw(){drawTop();drawGraph();stats();}

  const W2=e=>{const r=cT.getBoundingClientRect();return [(e.clientX-r.left-T.ox)/T.k,(e.clientY-r.top-T.oy)/T.k];};
  let drag=-1;
  cT.addEventListener('pointerdown',e=>{const [x,y]=W2(e);drag=poly.findIndex(p=>Math.hypot(p[0]-x,p[1]-y)*T.k<12);if(drag>=0)cT.setPointerCapture(e.pointerId);});
  cT.addEventListener('pointermove',e=>{if(drag<0)return;const [x,y]=W2(e);poly[drag]=[Math.round(x*2)/2,Math.round(y*2)/2];
    // 드래그 중에는 현재 각도만 다시 계산
    let bt=null;for(let oy=0;oy<P.sl*2+P.aw;oy+=2)for(let cx=2;cx<62;cx+=10){const r=layout(curTh,oy,cx);if(!bt||r.n>bt.n)bt=r;}
    const i=best.res.findIndex(r=>Math.abs(r.th-curTh)<1e-6); best.res[i]=bt; drawTop(); stats();});
  cT.addEventListener('pointerup',()=>{if(drag>=0){drag=-1;search();draw();}});
  cT.addEventListener('dblclick',e=>{const [x,y]=W2(e);const vi=poly.findIndex(p=>Math.hypot(p[0]-x,p[1]-y)*T.k<12);
    if(vi>=0){if(poly.length>3)poly.splice(vi,1);} else {let bi=-1,bd=1e9;poly.forEach((a,i)=>{const d=segD(x,y,a,poly[(i+1)%poly.length]);if(d<bd){bd=d;bi=i;}}); if(bd*T.k<14) poly.splice(bi+1,0,[Math.round(x*2)/2,Math.round(y*2)/2]);} search();draw();});
  cG.addEventListener('click',e=>{const r=cG.getBoundingClientRect(),i=Math.floor((e.clientX-r.left-GB.l)/GB.bw);if(i>=0&&i<best.res.length){curTh=best.res[i].th;draw();}});
  LabIO(app,{name:'parking',poly:{get:()=>poly,set:v=>poly=v},state:()=>({P,poly}),load:o=>{Object.assign(P,o.P||{});if(o.poly)poly=o.poly;refresh();},redraw:()=>{search();draw();},
    dxf:()=>{const L=current(),c=Math.cos(L.th),s=Math.sin(L.th),G=(x,y)=>[x*c-y*s,x*s+y*c],E=[{layer:'SITE',pts:poly}];
      L.stalls.forEach(q=>E.push({layer:'STALL',pts:[G(q[0],q[1]),G(q[0]+q[2],q[1]),G(q[0]+q[2],q[1]+q[3]),G(q[0],q[1]+q[3])]}));
      L.aisles.forEach(a=>E.push({layer:'AISLE',closed:false,pts:[G(a[0],a[1]+a[3]/2),G(a[0]+a[2],a[1]+a[3]/2)]}));
      if(L.con){const a=L.con;E.push({layer:'AISLE',closed:false,pts:[G(a[0]+a[2]/2,a[1]),G(a[0]+a[2]/2,a[1]+a[3])]});}return E;}});
  addEventListener('resize',draw); search(); draw();
})();
</script>

<div id="lb"><img alt=""><button class="p" aria-label="이전">‹</button><button class="n" aria-label="다음">›</button><div class="c"></div></div>
<script>

// 표지 기본 화면: 실시간 그림자. 기둥 필드가 서울의 지금 해 위치대로 그림자를 드리운다. 마우스 가로 = 하루의 시각.
(function(){var cv=document.querySelector('.cv0 .topo');if(!cv)return;var g=cv.getContext('2d'),W,H,SP=34,poles=[],still=matchMedia('(prefers-reduced-motion:reduce)').matches,info=document.querySelector('.sunr');
var LAT=37.57*Math.PI/180,LON=126.98,hov=null,cur=null;
function now(){var d=new Date(),u=d.getTime()+d.getTimezoneOffset()*6e4,k=new Date(u+9*36e5),st=new Date(Date.UTC(k.getUTCFullYear(),0,0)),n=Math.floor((k-st)/864e5)+0;
 var B=2*Math.PI*(n-81)/364,eot=9.87*Math.sin(2*B)-7.53*Math.cos(B)-1.5*Math.sin(B),clock=k.getUTCHours()+k.getUTCMinutes()/60;
 return {n:n,clock:clock,solar:clock+((LON-135)*4+eot)/60};}
function sun(n,t){var d=23.44*Math.PI/180*Math.sin(2*Math.PI*(284+n)/365),H=(t-12)*15*Math.PI/180;var alt=Math.asin(Math.sin(LAT)*Math.sin(d)+Math.cos(LAT)*Math.cos(d)*Math.cos(H));
 var az=Math.atan2(Math.sin(H),Math.cos(H)*Math.sin(LAT)-Math.tan(d)*Math.cos(LAT));return {alt:alt,az:az};}
function size(){var r=cv.getBoundingClientRect(),dp=Math.min(2,devicePixelRatio||1);W=r.width;H=r.height;cv.width=W*dp;cv.height=H*dp;g.setTransform(dp,0,0,dp,0,0);poles=[];
 for(var y=SP/2;y<H+SP;y+=SP)for(var x=SP/2;x<W+SP;x+=SP){var nz=Math.sin(x*.013)*Math.cos(y*.017)+Math.sin((x+y)*.006);poles.push([x,y,14+9*(nz+2)/4]);}}
function draw(){var N=now(),t=hov!==null?hov:N.solar,S=sun(N.n,t);cur=S;g.clearRect(0,0,W,H);
 var up=S.alt>0.005,L=up?Math.min(9,1/Math.tan(S.alt)):0,dx=Math.sin(S.az),dy=-Math.cos(S.az),warm=up?Math.max(0,1-S.alt/(Math.PI/4)):0;
 var cR=Math.round(230+25*warm),cG=Math.round(228-40*warm),cB=Math.round(220-110*warm);
 if(up){var gr=g.createRadialGradient(W/2-dx*W*.6,H/2-dy*H*.6,0,W/2,H/2,Math.max(W,H));gr.addColorStop(0,'rgba('+cR+','+cG+','+cB+','+(0.05+0.06*Math.sin(S.alt))+')');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,W,H);}
 g.lineCap='round';
 for(var i=0;i<poles.length;i++){var p=poles[i],x=p[0],y=p[1];
  if(up){var l=p[2]*L,ex=x+dx*l,ey=y+dy*l,gg=g.createLinearGradient(x,y,ex,ey);gg.addColorStop(0,'rgba('+cR+','+cG+','+cB+',.38)');gg.addColorStop(1,'rgba('+cR+','+cG+','+cB+',0)');
   g.strokeStyle=gg;g.lineWidth=1.6;g.beginPath();g.moveTo(x,y);g.lineTo(ex,ey);g.stroke();}
  g.fillStyle=up?'rgba(239,237,230,.55)':'rgba(239,237,230,.16)';g.beginPath();g.arc(x,y,1.3,0,7);g.fill();}
 var m=document.querySelector('.cvm');if(m){var cr=cv.getBoundingClientRect();m.querySelectorAll('a').forEach(function(x){var r=x.getBoundingClientRect();g.clearRect(r.left-cr.left-12,r.top-cr.top,r.width+24,r.height);});}
 if(info){var hh=Math.floor(t),mm=Math.floor((t-hh)*60),f=function(v){return String(v).padStart(2,'0');},c=hov!==null?'해를 옮기는 중 · 태양시 '+f(((hh%24)+24)%24)+':'+f(mm):'서울 지금 '+f(Math.floor(N.clock))+':'+f(Math.floor((N.clock%1)*60));
  info.textContent=c+' · 태양 고도 '+(S.alt*180/Math.PI).toFixed(0)+'°'+(up?'':' · 해가 졌어요. 화면을 가로로 훑어 보세요');}}
var tgt=null;cv.parentNode.addEventListener('mousemove',function(e){var r=cv.getBoundingClientRect();tgt=5+14*(e.clientX-r.left)/r.width;if(hov===null)hov=now().solar;});
cv.parentNode.addEventListener('mouseleave',function(){tgt=null;});
var last=0;function loop(ts){requestAnimationFrame(loop);if(ts-last<33)return;last=ts;
 if(tgt!==null){hov+=(tgt-hov)*.12;}else if(hov!==null){var s0=now().solar;hov+=(s0-hov)*.08;if(Math.abs(hov-s0)<.01)hov=null;}draw();}
addEventListener('resize',function(){size();draw();});size();draw();if(!still)requestAnimationFrame(loop);else setInterval(draw,60000);})();
(function(){var m=document.querySelector('.cvm');if(!m)return;var bg=document.querySelectorAll('.cv0 .bg'),a=m.querySelectorAll('a');
a.forEach(function(x,i){x.addEventListener('mouseenter',function(){bg.forEach(function(b,k){b.classList.toggle('on',k===i)});m.classList.add('hov');a.forEach(function(o){o.classList.toggle('on',o===x)});});});
m.addEventListener('mouseleave',function(){bg.forEach(function(b){b.classList.remove('on')});m.classList.remove('hov');a.forEach(function(o){o.classList.remove('on')});});})();
(function(){var pv=document.querySelector('.lpv');if(!pv)return;document.querySelectorAll('.lr.f').forEach(function(r){
r.addEventListener('mouseenter',function(){pv.src=r.dataset.img;pv.classList.add('on');});r.addEventListener('mouseleave',function(){pv.classList.remove('on');});
r.addEventListener('mousemove',function(e){pv.style.transform='translate('+(e.clientX+28)+'px,'+(e.clientY-120)+'px)';});});})();
(function(){var st=document.querySelector('.stg');if(!st)return;var sl=st.querySelectorAll('.sl'),li=document.querySelectorAll('.ixl li');
li.forEach(function(l){l.addEventListener('mouseenter',function(){var i=+l.dataset.i;sl.forEach(function(x,k){x.classList.toggle('on',k===i)});li.forEach(function(o){o.classList.toggle('on',o===l)});});});})();

const lb=document.getElementById('lb'),li=lb.querySelector('img'),lc=lb.querySelector('.c');let L=[],ix=0;
function show(i){ix=(i+L.length)%L.length;li.src=L[ix].src;const f=L[ix].closest('figure').querySelector('figcaption');lc.textContent=(f?f.textContent:'')+'  '+(ix+1)+' / '+L.length;}
document.addEventListener('click',e=>{
 if(e.target.closest('#lb button')){show(ix+(e.target.classList.contains('n')?1:-1));return}
 if(e.target.closest('#lb')){lb.classList.remove('on');return}
 const im=e.target.closest('figure img');if(im){L=[...document.querySelectorAll('figure img')];show(L.indexOf(im));lb.classList.add('on')}});
document.addEventListener('keydown',e=>{if(!lb.classList.contains('on'))return;if(e.key==='Escape')lb.classList.remove('on');if(e.key==='ArrowRight')show(ix+1);if(e.key==='ArrowLeft')show(ix-1)});
if('IntersectionObserver' in window){const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{rootMargin:'0px 0px -8% 0px'});
document.querySelectorAll('.blk,.txt,.work').forEach(el=>{el.classList.add('fade');io.observe(el)})}
</script>
