<section class="lab" id="lab-stair"><div class="lh"><p class="k"><a href="../process.html">← AI와 설계하기</a> · LAB 04 · CIRCULATION</p><h3>계단 설계</h3><p>층고와 용도를 정하면 단높이를 목표값 이하로 맞춰 단 수를 정하고, 보행 공식(2R+T ≈ 63cm)으로 단너비를 잡는다. 3m마다 계단참, 용도별 단높이 · 단너비 · 폭 기준(피난·방화구조 규칙 제15조 등)을 함께 판정하고 계단실 크기를 낸다.</p></div><div class="app"></div></section><script>// 실험 앱 공통: 슬라이더 패널 만들기 + 임베드(모달) 모드
(function(){
  if(/[?&]embed/.test(location.search)) document.documentElement.classList.add('embed');
  window.LabUI=function(box,ctl,onChange){
    const groups={}; ctl.forEach((c,i)=>{c.i=i;(groups[c.g]=groups[c.g]||[]).push(c);});
    box.innerHTML=Object.entries(groups).map(([g,cs])=>`<fieldset><legend>${g}</legend>${cs.map(c=>c.opts
      ?`<label><span>${c.k}</span><select data-k="${c.i}">${c.opts.map((o,j)=>`<option value="${j}" ${j==c.get()?'selected':''}>${o}</option>`).join('')}</select><output></output></label>`
      :`<label><span>${c.k}</span><input type="range" min="${c.min}" max="${c.max}" step="${c.step}" value="${c.get()}" data-k="${c.i}"><output>${c.fmt?c.fmt(c.get()):c.get()}</output></label>`).join('')}</fieldset>`).join('');
    let tm=null;
    box.addEventListener('input',e=>{const i=e.target.dataset.k; if(i===undefined) return; const c=ctl[i], v=parseFloat(e.target.value); c.set(v);
      if(!c.opts) e.target.nextElementSibling.textContent=c.fmt?c.fmt(v):v; clearTimeout(tm); tm=setTimeout(onChange,40);});
    return function(){box.querySelectorAll('[data-k]').forEach(el=>{const c=ctl[el.dataset.k];el.value=c.get();if(!c.opts)el.nextElementSibling.textContent=c.fmt?c.fmt(c.get()):c.get();});};
  };
  window.LabRng=function(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}};
})();
// 공통 그리기 도구 (어두운 도면 시트)
window.LD={INK:'#e6e3da',DIM:'#8a8a80',FAINT:'#3a3a35',BG:'#151513',RED:'#ff6b4a',BLUE:'#4da3ff',GREEN:'#9fd36b',MONO:'"JetBrains Mono",ui-monospace,monospace',
  fit:function(cv){var r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;var g=cv.getContext('2d');g.setTransform(d,0,0,d,0,0);g.lineJoin='round';g.fillStyle='#151513';g.fillRect(0,0,r.width,r.height);return [g,r.width,r.height];},
  path:function(g,p,close){g.beginPath();p.forEach(function(v,i){i?g.lineTo(v[0],v[1]):g.moveTo(v[0],v[1]);});if(close!==false)g.closePath();},
  text:function(g,s,x,y,o){o=o||{};g.font=(o.w||'')+' '+(o.size||10)+'px '+LD.MONO;g.fillStyle=o.c||LD.DIM;g.textAlign=o.a||'left';g.fillText(s,x,y);},
  dim:function(g,x1,y1,x2,y2,label,off,c){c=c||LD.BLUE;var dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,nx=-dy/L*off,ny=dx/L*off;g.strokeStyle=c;g.lineWidth=.7;g.beginPath();
    g.moveTo(x1,y1);g.lineTo(x1+nx*1.15,y1+ny*1.15);g.moveTo(x2,y2);g.lineTo(x2+nx*1.15,y2+ny*1.15);g.moveTo(x1+nx,y1+ny);g.lineTo(x2+nx,y2+ny);g.stroke();
    var mx=(x1+x2)/2+nx*1.6,my=(y1+y2)/2+ny*1.6;g.save();g.translate(mx,my);var a=Math.atan2(dy,dx);if(a>Math.PI/2||a<-Math.PI/2)a+=Math.PI;g.rotate(a);LD.text(g,label,0,3,{c:c,a:'center'});g.restore();},
  stats:function(el,rows,hi,note){el.innerHTML=rows.map(function(r,i){return '<div class="'+(hi&&hi.indexOf(i)>=0?'hi':'')+(r[2]==='ng'?' ng':'')+'"><span>'+r[0]+'</span><b>'+r[1]+'</b></div>';}).join('')+(note?'<p class="note">'+note+'</p>':'');}
};

// 실사용 도구줄: 좌표 · DXF 입력, PNG · CSV · DXF 내보내기, 링크로 조건 저장
window.LabIO=function(app,o){
  const bar=document.createElement('div'); bar.className='lio';
  bar.innerHTML=(o.poly?`<details class="lin"><summary>대지 입력</summary><p>꼭짓점 좌표를 한 줄에 하나씩 <code>x, y</code> (m, 북쪽이 +y). 또는 DXF의 닫힌 폴리라인을 올리세요.</p><textarea rows="6"></textarea><div><button type="button" class="ap">좌표 적용</button><label class="up">DXF 열기<input type="file" accept=".dxf"></label><span class="msg"></span></div></details>`:'')+
    `<button type="button" data-x="png">PNG</button><button type="button" data-x="csv">CSV</button>${o.dxf?'<button type="button" data-x="dxf">DXF</button>':''}<button type="button" data-x="link">링크 복사</button>`;
  app.appendChild(bar);
  const name=o.name||'lab', msg=bar.querySelector('.msg');
  const save=(blob,fn)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);};
  const flash=(b,t)=>{const o2=b.textContent;b.textContent=t;setTimeout(()=>b.textContent=o2,1400);};
  // 좌표 ↔ 내부 좌표 (내부는 y가 아래로 = 남쪽)
  const toText=p=>p.map(q=>`${q[0].toFixed(2)}, ${(-q[1]).toFixed(2)}`).join('\n');
  function setPoly(pts){ if(pts.length<3){msg.textContent='점이 3개 이상 필요해요';return;}
    const xs=pts.map(p=>p[0]),ys=pts.map(p=>-p[1]),mx=Math.min(...xs),my=Math.min(...ys);
    o.poly.set(pts.map(p=>[Math.round((p[0]-mx+3)*100)/100,Math.round((-p[1]-my+3)*100)/100])); msg.textContent=pts.length+'개 점 적용'; o.redraw(); }
  if(o.poly){
    const ta=bar.querySelector('textarea'); bar.querySelector('.lin').addEventListener('toggle',()=>{ta.value=toText(o.poly.get());});
    bar.querySelector('.ap').onclick=()=>{const pts=ta.value.split(/\n/).map(l=>l.split(/[,\s\t]+/).filter(Boolean).map(Number)).filter(a=>a.length>=2&&a.every(isFinite)).map(a=>[a[0],a[1]]);setPoly(pts);};
    bar.querySelector('input[type=file]').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{
      const L=t.split(/\r?\n/).map(s=>s.trim()), polys=[]; let cur=null;
      for(let i=0;i<L.length-1;i+=2){const c=L[i],v=L[i+1];
        if(c==='0'){ if(cur&&cur.length>2) polys.push(cur); cur=(v==='LWPOLYLINE'||v==='POLYLINE')?[]:(v==='VERTEX'&&cur?cur:null); if(v==='VERTEX'&&polys.length&&!cur){} }
        else if(cur&&c==='10') cur.push([+v,0]); else if(cur&&c==='20'&&cur.length) cur[cur.length-1][1]=+v; }
      if(cur&&cur.length>2) polys.push(cur);
      if(!polys.length){msg.textContent='닫힌 폴리라인을 찾지 못했어요';return;}
      const ar=p=>Math.abs(p.reduce((s,a,i)=>{const b=p[(i+1)%p.length];return s+a[0]*b[1]-b[0]*a[1];},0))/2;
      let P=polys.sort((a,b)=>ar(b)-ar(a))[0]; const ext=Math.max(...P.map(p=>Math.abs(p[0])),...P.map(p=>Math.abs(p[1])));
      const xs=P.map(p=>p[0]),ys=P.map(p=>p[1]),span=Math.max(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys));
      if(span>1000) P=P.map(p=>[p[0]/1000,p[1]/1000]); // mm → m
      setPoly(P); ta.value=toText(o.poly.get());});};
  }
  bar.addEventListener('click',e=>{const x=e.target.dataset&&e.target.dataset.x;if(!x)return;
    if(x==='png'){const cvs=[...app.querySelectorAll('canvas')],h=Math.max(...cvs.map(c=>c.height)),w=cvs.reduce((s,c)=>s+c.width,0);
      const out=document.createElement('canvas');out.width=w;out.height=h;const g=out.getContext('2d');g.fillStyle='#151513';g.fillRect(0,0,w,h);let ox=0;cvs.forEach(c=>{g.drawImage(c,ox,0);ox+=c.width;});
      out.toBlob(b=>save(b,name+'.png'));}
    if(x==='csv'){const rows=[...app.querySelectorAll('.nls div')].map(d=>[d.querySelector('span').textContent,d.querySelector('b').textContent]);
      const st=o.state();rows.push(['',''],['입력값','']);Object.entries(st.P||{}).forEach(([k,v])=>rows.push([k,v]));
      if(o.poly) o.poly.get().forEach((p,i)=>rows.push(['대지 점 '+(i+1),p[0].toFixed(2)+' / '+(-p[1]).toFixed(2)]));
      save(new Blob(['﻿'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'}),name+'.csv');}
    if(x==='dxf'){const ents=o.dxf();let d='0\nSECTION\n2\nENTITIES\n';
      ents.forEach(en=>{const p=en.pts,n=p.length,z=en.z||0;for(let i=0;i<(en.closed===false?n-1:n);i++){const a=p[i],b=p[(i+1)%n];
        d+=`0\nLINE\n8\n${en.layer}\n10\n${a[0].toFixed(3)}\n20\n${(-a[1]).toFixed(3)}\n30\n${(a[2]!==undefined?a[2]:z).toFixed(3)}\n11\n${b[0].toFixed(3)}\n21\n${(-b[1]).toFixed(3)}\n31\n${(b[2]!==undefined?b[2]:z).toFixed(3)}\n`;}});
      d+='0\nENDSEC\n0\nEOF\n'; save(new Blob([d],{type:'application/dxf'}),name+'.dxf');}
    if(x==='link'){const u=location.href.split('#')[0]+'#s='+btoa(unescape(encodeURIComponent(JSON.stringify(o.state()))));
      (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>flash(e.target,'복사됨'),()=>{prompt('이 링크를 복사하세요',u);});}
  });
  // 링크로 연 경우 조건 복원
  const m=location.hash.match(/s=([^&]+)/); if(m){try{o.load(JSON.parse(decodeURIComponent(escape(atob(m[1])))));}catch(e){}}
};
// LAB 04 — 계단 설계
// 층고를 끌어 올리면 단 수 · 단높이 · 디딤판 · 계단참이 다시 잡히고, 용도별 법규(건축물의 피난·방화구조 등의 기준에 관한 규칙 제15조,
// 공동주택은 주택건설기준 등에 관한 규정)와 보행 공식(2R+T ≈ 63cm)으로 OK/NG를 판정한다.
(function(){
  const root=document.getElementById('lab-stair'); if(!root) return;
  const USE=[
    {n:'일반 (기타 건축물)',R:20,T:24,W:60},
    {n:'공동주택',R:18,T:26,W:120},
    {n:'판매 · 집회 · 문화',R:18,T:26,W:120},
    {n:'중 · 고등학교',R:18,T:26,W:150},
    {n:'초등학교',R:16,T:26,W:150},
  ];
  const P={H:3.6,W:120,use:1,type:1,rt:17};
  const app=root.querySelector('.app');
  app.innerHTML=`<div class="lctl"></div>
  <div class="nlv"><div class="cv sheet"><canvas class="sec"></canvas><p class="hint">위층 바닥의 파란 점을 위아래로 드래그 = 층고</p></div>
  <div class="cv sheet"><canvas class="pl"></canvas><p class="hint">파란 점을 좌우로 드래그 = 계단 폭</p></div></div><div class="nls"></div>`;
  const cS=app.querySelector('.sec'), cP=app.querySelector('.pl'), out=app.querySelector('.nls');
  const refresh=LabUI(app.querySelector('.lctl'),[
    {g:'법규',k:'용도',opts:USE.map(u=>u.n),get:()=>P.use,set:v=>P.use=v},
    {g:'계단',k:'형식',opts:['직선 계단','ㄷ자 (반층참)'],get:()=>P.type,set:v=>P.type=v},
    {g:'계단',k:'목표 단높이 cm',min:14,max:20,step:.5,get:()=>P.rt,set:v=>P.rt=v},
  ],draw);

  function compute(){
    const U=USE[P.use], Hc=P.H*100, rmax=Math.min(U.R,P.rt);
    const n=Math.ceil(Hc/rmax-1e-9), R=Hc/n;
    const T=Math.max(U.T,Math.min(32,Math.round((63-2*R)*2)/2));
    let f=Math.max(P.type?2:1,Math.ceil(P.H/3-1e-9)); if(P.type&&f%2) f++;
    const per=[]; for(let i=0;i<f;i++) per.push(Math.floor(n/f)+(i<n%f?1:0));
    const land=Math.max(120,P.W), runs=per.map(r=>(r-1)*T);
    const planL = P.type ? Math.max(...runs)+land : runs.reduce((a,b)=>a+b,0)+(f-1)*land;
    const planW = P.type ? 2*P.W+10 : P.W;
    const blondel=2*R+T, maxFlightH=Math.max(...per)*R;
    const checks=[
      ['단높이 ≤ '+U.R,R<=U.R+1e-6],['단너비 ≥ '+U.T,T>=U.T],['계단 폭 ≥ '+U.W,P.W>=U.W],
      ['2R+T 60~66',blondel>=60&&blondel<=66],['3m마다 계단참',maxFlightH<=300+1e-6]];
    return {U,n,R,T,f,per,land,runs,planL,planW,blondel,checks,ang:Math.atan(R/T)*180/Math.PI};
  }

  let SS=null, SP=null;
  function drawSec(Z){
    const [g,W,H]=LD.fit(cS), Hc=P.H*100;
    // 단면: 직선은 전체 펼침, ㄷ자는 첫 비행 + 참 + 둘째 비행(뒤쪽, 흐리게)
    const L = P.type ? Math.max(...Z.runs)+Z.land : Z.planL;
    const k=Math.min((W-110)/L,(H-70)/(Hc+60)), ox=60, oy=H-34;
    SS={k,ox,oy}; const X=x=>ox+x*k, Y=z=>oy-z*k;
    // 바닥 슬래브
    g.fillStyle='#2a2a26'; g.fillRect(X(-40),Y(0),(L+80)*k,18*k+2); g.fillRect(X(P.type?-40:L-10),Y(Hc),(P.type?Z.runs[0]+60:90)*k,18*k+2);
    let x=0,z=0, pts=[[X(0),Y(0)]], ghost=[];
    Z.per.forEach((r,fi)=>{
      const dir = P.type ? (fi%2?-1:1) : 1, line=[];
      for(let i=0;i<r;i++){ z+=Z.R; line.push([x,z-Z.R],[x,z]); if(i<r-1) x+=dir*Z.T; }
      const pp=line.map(p=>[X(p[0]),Y(p[1])]);
      if(P.type&&fi%2){ghost.push(pp);} else pts.push(...pp);
      if(fi<Z.per.length-1){ const lx=x+dir*Z.land; if(!(P.type&&fi%2)) pts.push([X(lx),Y(z)]); else ghost[ghost.length-1].push([X(lx),Y(z)]); if(!P.type) x=lx; }
    });
    // 계단 몸체 (포셰)
    g.lineWidth=1.2; g.strokeStyle=LD.INK;
    LD.path(g,pts,false); g.stroke();
    ghost.forEach(pp=>{g.setLineDash([4,3]);g.strokeStyle=LD.DIM;LD.path(g,pp,false);g.stroke();g.setLineDash([]);});
    // 기울기 선 + 헤드룸 2.1m
    const fr=Z.per[0], x1=(fr-1)*Z.T, z1=fr*Z.R;
    g.strokeStyle='rgba(77,163,255,.5)';g.setLineDash([2,3]);g.beginPath();g.moveTo(X(0),Y(0+210));g.lineTo(X(x1),Y(z1+210));g.stroke();g.setLineDash([]);
    LD.text(g,'헤드룸 2.1m',X(x1*0.25),Y(Z.R*fr*0.25+210)-6,{c:LD.BLUE});
    // 단 치수 (빨강)
    const sx=X(Z.T), sz=Y(2*Z.R);
    g.strokeStyle=LD.RED;g.lineWidth=1.4;g.beginPath();g.moveTo(X(Z.T),Y(Z.R));g.lineTo(X(Z.T),Y(2*Z.R));g.lineTo(X(2*Z.T),Y(2*Z.R));g.stroke();
    LD.text(g,`R ${Z.R.toFixed(1)}`,sx-6,(Y(Z.R)+Y(2*Z.R))/2+3,{c:LD.RED,a:'right'}); LD.text(g,`T ${Z.T}`,(X(Z.T)+X(2*Z.T))/2,sz-6,{c:LD.RED,a:'center'});
    // 층고 치수 + 핸들
    LD.dim(g,X(L)+30,Y(0),X(L)+30,Y(Hc),`H ${P.H.toFixed(2)}m`,-14);
    LD.text(g,'FL ±0',X(-40),Y(0)+14); LD.text(g,`FL +${P.H.toFixed(2)}`,X(P.type?-40:L-10),Y(Hc)-6);
    const hx=P.type?X(-40)+10:X(L)+10; g.beginPath();g.arc(hx,Y(Hc),6,0,7);g.fillStyle=LD.BG;g.fill();g.strokeStyle=LD.BLUE;g.lineWidth=2;g.stroke();
    SS.hx=hx; SS.hy=Y(Hc);
    LD.text(g,`${Z.n}단 · 경사 ${Z.ang.toFixed(1)}°`,12,18,{c:LD.INK,size:11});
  }
  function drawPlan(Z){
    const [g,W,H]=LD.fit(cP);
    const k=Math.min((W-90)/Z.planL,(H-80)/Z.planW), ox=(W-Z.planL*k)/2, oy=(H-Z.planW*k)/2;
    SP={k,ox,oy}; const X=x=>ox+x*k, Y=y=>oy+y*k;
    g.strokeStyle=LD.INK; g.lineWidth=1.4; g.strokeRect(X(0),Y(0),Z.planL*k,Z.planW*k);
    const tread=(x0,y0,w,n,dir)=>{g.strokeStyle=LD.INK;g.lineWidth=.7;g.beginPath();for(let i=0;i<=n;i++){const x=x0+dir*i*Z.T;g.moveTo(X(x),Y(y0));g.lineTo(X(x),Y(y0+w));}g.stroke();};
    const land=(x0,y0,w,h)=>{g.save();g.beginPath();g.rect(X(x0),Y(y0),w*k,h*k);g.clip();g.fillStyle='rgba(255,255,255,.04)';g.fillRect(X(x0),Y(y0),w*k,h*k);g.strokeStyle=LD.FAINT;g.lineWidth=.6;g.beginPath();for(let s=-h*k;s<w*k;s+=8){g.moveTo(X(x0)+s,Y(y0)+h*k);g.lineTo(X(x0)+s+h*k,Y(y0));}g.stroke();g.restore();g.strokeStyle=LD.INK;g.lineWidth=.8;g.strokeRect(X(x0),Y(y0),w*k,h*k);};
    let arrow=[];
    if(P.type){
      const r0=Z.runs[0], r1=Z.runs[1]||r0, L0=Z.planL-Z.land;
      tread(0,Z.planW-P.W,P.W,Z.per[0]-1,1); tread(L0,0,P.W,(Z.per[1]||1)-1,-1);
      land(L0,0,Z.land,Z.planW);
      g.strokeStyle=LD.INK;g.lineWidth=1;g.beginPath();g.moveTo(X(0),Y(P.W+5));g.lineTo(X(L0),Y(P.W+5));g.stroke();
      arrow=[[0+Z.T/2,Z.planW-P.W/2],[L0+Z.land/2,Z.planW-P.W/2],[L0+Z.land/2,P.W/2],[L0-r1+Z.T/2,P.W/2]];
    } else {
      let x=0; Z.per.forEach((r,i)=>{tread(x,0,P.W,r-1,1); x+=(r-1)*Z.T; if(i<Z.per.length-1){land(x,0,Z.land,P.W); x+=Z.land;}});
      arrow=[[Z.T/2,P.W/2],[Z.planL-Z.T/2,P.W/2]];
    }
    g.strokeStyle=LD.RED;g.lineWidth=1.2;LD.path(g,arrow.map(p=>[X(p[0]),Y(p[1])]),false);g.stroke();
    const e=arrow[arrow.length-1], e0=arrow[arrow.length-2], a=Math.atan2(e[1]-e0[1],e[0]-e0[0]);
    g.beginPath();g.moveTo(X(e[0]),Y(e[1]));g.lineTo(X(e[0])-9*Math.cos(a-.4),Y(e[1])-9*Math.sin(a-.4));g.moveTo(X(e[0]),Y(e[1]));g.lineTo(X(e[0])-9*Math.cos(a+.4),Y(e[1])-9*Math.sin(a+.4));g.stroke();
    g.beginPath();g.arc(X(arrow[0][0]),Y(arrow[0][1]),3,0,7);g.fillStyle=LD.RED;g.fill(); LD.text(g,'UP',X(arrow[0][0])+6,Y(arrow[0][1])-6,{c:LD.RED});
    LD.dim(g,X(0),Y(Z.planW),X(Z.planL),Y(Z.planW),`${(Z.planL/100).toFixed(2)} m`,22);
    LD.dim(g,X(0),Y(0),X(0),Y(Z.planW),`${(Z.planW/100).toFixed(2)} m`,22);
    // 폭 핸들: 첫 비행 바깥 변
    const hy=P.type?Y(Z.planW):Y(P.W), hx=X(Z.T*1.5); g.beginPath();g.arc(hx,hy,6,0,7);g.fillStyle=LD.BG;g.fill();g.strokeStyle=LD.BLUE;g.lineWidth=2;g.stroke();
    SP.hx=hx;SP.hy=hy;
    LD.text(g,`계단실 ${(Z.planL/100).toFixed(2)} × ${(Z.planW/100).toFixed(2)} m · 폭 ${P.W}cm · 참 ${Z.land}cm`,12,18,{c:LD.INK,size:11});
  }
  function stats(Z){
    LD.stats(out,[
      ['층고',P.H.toFixed(2)+' m'],['단 수',Z.n+'단 · '+Z.f+'비행'],['단높이 R',Z.R.toFixed(1)+' cm'],['단너비 T',Z.T+' cm'],
      ['2R + T',Z.blondel.toFixed(1)+' cm'],['계단실',(Z.planL/100).toFixed(2)+' × '+(Z.planW/100).toFixed(2)+' m'],
      ['법규 · 보행',Z.checks.filter(c=>c[1]).length+' / '+Z.checks.length+' OK'],['NG',Z.checks.filter(c=>!c[1]).map(c=>c[0]).join(', ')||'없음',Z.checks.some(c=>!c[1])?'ng':'']
    ],[6,7],`${Z.U.n}: 단높이 ${Z.U.R}cm 이하 · 단너비 ${Z.U.T}cm 이상 · 폭 ${Z.U.W}cm 이상, 높이 3m를 넘으면 3m 이내마다 너비 120cm 이상의 계단참. 2R+T는 걷기 편한 범위(블롱델 공식)로 법규가 아니라 권장값.`);
  }
  function draw(){const Z=compute();drawSec(Z);drawPlan(Z);stats(Z);}

  // 조작
  let dS=false,dP=false;
  const loc=(cv,e)=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];};
  cS.addEventListener('pointerdown',e=>{const [x,y]=loc(cS,e);if(Math.hypot(x-SS.hx,y-SS.hy)<14){dS=true;cS.setPointerCapture(e.pointerId);}});
  cS.addEventListener('pointermove',e=>{const [x,y]=loc(cS,e);if(!dS){cS.style.cursor=Math.hypot(x-SS.hx,y-SS.hy)<14?'ns-resize':'default';return;}
    P.H=Math.max(2.4,Math.min(6,Math.round((SS.oy-y)/SS.k/5)*5/100));draw();});
  cS.addEventListener('pointerup',()=>dS=false);
  cP.addEventListener('pointerdown',e=>{const [x,y]=loc(cP,e);if(Math.hypot(x-SP.hx,y-SP.hy)<14){dP=true;cP.setPointerCapture(e.pointerId);}});
  cP.addEventListener('pointermove',e=>{const [x,y]=loc(cP,e);if(!dP){cP.style.cursor=Math.hypot(x-SP.hx,y-SP.hy)<14?'ns-resize':'default';return;}
    const yy=(y-SP.oy)/SP.k; P.W=Math.max(60,Math.min(240,Math.round((P.type?(yy-10)/2:yy)/5)*5));draw();});
  cP.addEventListener('pointerup',()=>dP=false);
  LabIO(app,{name:'stair',state:()=>({P}),load:o=>{Object.assign(P,o.P||{});refresh();},redraw:draw});
  addEventListener('resize',draw); draw();
})();
</script>

(function(){var cv=document.querySelector('.cv0 .topo');if(!cv)return;var g=cv.getContext('2d'),W,H,S=11,nx,ny,F,mx=-1e4,my=-1e4,tx=-1e4,ty=-1e4,t=Math.random()*100,still=matchMedia('(prefers-reduced-motion:reduce)').matches;
var P=new Uint8Array(512);for(var i=0;i<256;i++)P[i]=i;for(i=255;i>0;i--){var j=Math.floor(Math.random()*(i+1)),x=P[i];P[i]=P[j];P[j]=x;}for(i=0;i<256;i++)P[i+256]=P[i];
function h(x,y,z){return P[P[P[x&255]+(y&255)]+(z&255)]/255;}function sm(a){return a*a*(3-2*a);}

return L(L(L(h(X,Y,Z),h(X+1,Y,Z),u),L(h(X,Y+1,Z),h(X+1,Y+1,Z),u),v),L(L(h(X,Y,Z+1),h(X+1,Y,Z+1),u),L(h(X,Y+1,Z+1),h(X+1,Y+1,Z+1),u),v),w);}

var dx=x-mx,dy=y-my;e+=.34*Math.exp(-(dx*dx+dy*dy)/(2*170*170));F[j*nx+i]=e;}}
function draw(){g.clearRect(0,0,W,H);var N=22;for(var k=1;k<N;k++){var lv=.12+k*.045;g.beginPath();
for(var j=0;j<ny-1;j++)for(var i=0;i<nx-1;i++){var a=F[j*nx+i],b=F[j*nx+i+1],c=F[(j+1)*nx+i+1],d=F[(j+1)*nx+i],cs=(a>lv?8:0)|(b>lv?4:0)|(c>lv?2:0)|(d>lv?1:0);if(cs===0||cs===15)continue;
var x=i*S,y=j*S,T=[x+S*(lv-a)/(b-a),y],R=[x+S,y+S*(lv-b)/(c-b)],B=[x+S*(lv-d)/(c-d),y+S],Lf=[x,y+S*(lv-a)/(d-a)],sg;

for(var q=0;q<sg.length;q+=2){g.moveTo(sg[q][0],sg[q][1]);g.lineTo(sg[q+1][0],sg[q+1][1]);}}
g.strokeStyle=k%5===0?'rgba(239,237,230,.42)':'rgba(239,237,230,.13)';g.lineWidth=k%5===0?1:.7;g.stroke();}var m=document.querySelector('.cvm');if(m){var cr=cv.getBoundingClientRect();m.querySelectorAll('a').forEach(function(x){var r=x.getBoundingClientRect();g.clearRect(r.left-cr.left-12,r.top-cr.top,r.width+24,r.height);});}}
var last=0;function loop(ts){requestAnimationFrame(loop);if(ts-last<40)return;last=ts;t+=.0022;mx+=(tx-mx)*.08;my+=(ty-my)*.08;field();draw();}

const lb=document.getElementById('lb'),li=lb.querySelector('img'),lc=lb.querySelector('.c');let L=[],ix=0;
